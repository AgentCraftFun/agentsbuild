// === Building Upgrades ===
const UPGRADES={
  wood_hut:{to:'log_cabin',cost:{wood:10,stone:5,gold:0}},
  log_cabin:{to:'stone_house',cost:{wood:5,stone:25,gold:0}},
  stone_house:{to:'brick_house',cost:{wood:0,stone:20,gold:10}},
};

function tryUpgrade(agent,building){
  const up=UPGRADES[building.type];
  if(!up)return false;
  if(!canAfford(up.cost))return false;
  if(building.owner!==agent.id)return false;
  G.wood-=up.cost.wood;G.stone-=up.cost.stone;G.gold-=up.cost.gold;
  const oldName=building.name;
  const newDef=TECH_TREE.find(t=>t.type===up.to);
  if(newDef){
    building.type=up.to;building.name=newDef.name;building.abbr=newDef.abbr;
    building.progress=0.5;building.complete=false;building.claimedBy=agent.id;
    building.tall=newDef.tall;building.width=newDef.w;building.height=newDef.h;building.pw=newDef.pw;building.ph=newDef.ph;
    gameEvent(`${agent.name} is upgrading ${oldName} to ${newDef.name}!`,'build_started');
    return true;
  }
  return false;
}

function findNearestDetail(vx,vy,types){
  // Search visible details for nearest matching type
  let best=null,bestD=Infinity;
  const sx2=Math.max(0,Math.floor(vx*WW)-8),sy2=Math.max(0,Math.floor(vy*WH)-8);
  const ex2=Math.min(WW,Math.ceil(vx*WW)+8),ey2=Math.min(WH,Math.ceil(vy*WH)+8);
  const dets=getDetails(sx2,sy2,ex2,ey2);
  for(const d of dets){
    if(!types.includes(d.t))continue;
    const key=`${d.x},${d.y}`;
    if(harvestables.has(key))continue;// already being harvested
    const dx=d.x/WW/TS-vx,dy=d.y/WH/TS-vy;
    const dist=dx*dx+dy*dy;
    if(dist<bestD){bestD=dist;best=d}
  }
  return best;
}

function pickBuildSite(bdef,agentId){
  const rng3=new SeededRNG(frame+G.clientBuildings.length*7);
  // Prefer building near agent's existing buildings
  const owned=G.clientBuildings.filter(b=>b.owner===agentId&&b.complete);
  for(let i=0;i<30;i++){
    let bx,by;
    if(owned.length>0&&Math.random()<0.7){
      // Near existing owned building
      const ref=owned[Math.floor(Math.random()*owned.length)];
      bx=(ref.x+((rng3.next()-0.5)*16))/WW;
      by=(ref.y+((rng3.next()-0.5)*12))/WH;
    }else{
      bx=0.15+rng3.next()*0.7;by=0.15+rng3.next()*0.7;
    }
    const tx=Math.max(1,Math.min(WW-2,Math.floor(bx*WW)));
    const ty=Math.max(1,Math.min(WH-2,Math.floor(by*WH)));
    const bi=tBiomes[ty*WW+tx];
    if(['deep_water','shallow_water','river'].includes(BL[bi]))continue;
    let ok=true;
    for(const eb of G.clientBuildings){
      if(Math.abs(eb.x-tx)+Math.abs(eb.y-ty)<8){ok=false;break}
    }
    if(ok)return{x:tx,y:ty};
  }
  return null;
}

function updateAgentMovement(){
  const hasLumberMill=G.clientBuildings.some(b=>b.type==='lumber_mill'&&b.complete);
  const hasQuarry=G.clientBuildings.some(b=>b.type==='quarry'&&b.complete);

  for(const a of S.agents){
    let v=agentVisual.get(a.id);
    if(!v){v={x:a.x/WW,y:a.y/WH,tx:a.x/WW,ty:a.y/WH};agentVisual.set(a.id,v)}

    let st=agentState.get(a.id);
    if(!st){st={state:'idle',target:null,timer:0,taskCooldown:0};agentState.set(a.id,st)}

    const isLazy=a.personality==='lazy';
    const speed=isLazy?0.008:0.015;
    v.x+=(v.tx-v.x)*speed;
    v.y+=(v.ty-v.y)*speed;
    const atTarget=Math.abs(v.x-v.tx)<0.005&&Math.abs(v.y-v.ty)<0.005;

    if(st.state==='idle'){
      st.taskCooldown--;
      if(st.taskCooldown>0)continue;
      // Lazy agents take breaks
      if(isLazy){st.taskCooldown=120;if(Math.random()<0.4)continue}
      else{st.taskCooldown=30}

      const soc=getAgentSocial(a.id);
      // Needs override: hungry agents forage, exhausted agents rest
      if(soc.hunger<30){
        G.food=Math.max(0,G.food);soc.hunger=Math.min(100,soc.hunger+40);
        gameEvent(`${a.name} stopped to eat`,'agent_message');
        st.taskCooldown=60;continue;
      }
      if(soc.energy<20){
        st.taskCooldown=120;
        // Walk to home if they have one
        if(soc.home){v.tx=soc.home.x/WW;v.ty=soc.home.y/WH}
        gameEvent(`${a.name} is resting`,'agent_message');
        continue;
      }
      // Morale affects speed (stored for use in movement)
      const moraleSpeedMult=Math.max(0.5,soc.morale/100);

      // Personality-driven decision
      const roll=Math.random();
      const pers=a.personality||'optimist';
      let action='gather';// default
      if(pers==='aggressive'){action=roll<0.6?'chop':roll<0.9?'mine':'build'}
      else if(pers==='grinder'){action='gather_needed'}
      else if(pers==='analyst'){action=roll<0.8?'build':'gather_needed'}
      else if(pers==='optimist'){action=roll<0.33?'chop':roll<0.66?'mine':'build'}
      else if(pers==='chaotic'){action=['chop','mine','build','gold'][Math.floor(roll*4)]}
      else if(pers==='lazy'){action=roll<0.5?'chop':'mine'}
      else if(pers==='confused'){action=['chop','mine','build','idle'][Math.floor(roll*4)]}
      else{action='gather_needed'}// overachiever etc

      // Resolve 'gather_needed' to specific resource
      if(action==='gather'||action==='gather_needed'){
        const next=getNextBuilding();
        if(next){
          const def={wood:Math.max(0,next.cost.wood-G.wood),stone:Math.max(0,next.cost.stone-G.stone),gold:Math.max(0,next.cost.gold-G.gold)};
          if(def.gold>def.wood&&def.gold>def.stone)action='gold';
          else if(def.stone>def.wood)action='mine';
          else action='chop';
        }else action='chop';
      }

      // Try to BUILD or UPGRADE
      if(action==='build'){
        // First try upgrading an owned building
        const ownedBuildings=G.clientBuildings.filter(b2=>b2.owner===a.id&&b2.complete&&UPGRADES[b2.type]);
        if(ownedBuildings.length>0&&Math.random()<0.3){
          const upTarget=ownedBuildings[0];
          if(tryUpgrade(a,upTarget)){
            st.state='building';st.target=upTarget;st.timer=0;
            v.tx=upTarget.x/WW;v.ty=upTarget.y/WH;
            continue;
          }
        }
        const next=getNextBuilding();
        if(next&&canAfford(next.cost)){
          // Check no one else is already building this type
          const existing=G.clientBuildings.find(b=>!b.complete&&b.type===next.type);
          if(existing&&!existing.claimedBy){
            // Join existing unclaimed site
            existing.claimedBy=a.id;
            st.state='building';st.target=existing;st.timer=0;
            v.tx=existing.x/WW;v.ty=existing.y/WH;
            continue;
          }
          if(!existing){
            const site=pickBuildSite(next,a.id);
            if(site){
              const cb={type:next.type,name:next.name,abbr:next.abbr,x:site.x,y:site.y,
                progress:0,complete:false,faction:next.faction,width:next.w,height:next.h,pw:next.pw,ph:next.ph,tall:next.tall,claimedBy:a.id};
              if(G.clientBuildings.length>=30){action='chop';continue}// building cap
              G.clientBuildings.push(cb);
              G.wood-=next.cost.wood;G.stone-=next.cost.stone;G.gold-=next.cost.gold;
              st.state='building';st.target=cb;st.timer=0;
              v.tx=site.x/WW;v.ty=site.y/WH;
              gameEvent(`${a.name} started building ${next.name}!`,'build_started');
              continue;
            }
          }
        }
        // Can't build — fallback to gathering
        action='chop';
      }

      // GATHER resources
      if(action==='chop'){
        const tree=findNearestDetail(v.x,v.y,['deciduous','oak','pine','birch']);
        if(tree){st.state='walking_to_tree';st.target=tree;v.tx=tree.x/WW/TS+0.01;v.ty=tree.y/WH/TS+0.01}
        else{v.tx=0.1+Math.random()*0.8;v.ty=0.1+Math.random()*0.8;st.taskCooldown=60}
      }else if(action==='mine'){
        const rock=findNearestDetail(v.x,v.y,['rock','lgboulder','mdboulder']);
        if(rock){st.state='walking_to_rock';st.target=rock;v.tx=rock.x/WW/TS+0.01;v.ty=rock.y/WH/TS+0.01}
        else{v.tx=0.4+Math.random()*0.2;v.ty=0.1+Math.random()*0.2;st.taskCooldown=60}
      }else if(action==='gold'){
        const dep=goldDeposits.find(g=>g.alive);
        if(dep){st.state='walking_to_gold';st.target=dep;v.tx=dep.x/WW/TS+0.01;v.ty=dep.y/WH/TS+0.01}
        else{action='mine';st.taskCooldown=10}// retry as stone
      }
    }
    else if(st.state==='walking_to_tree'||st.state==='walking_to_rock'||st.state==='walking_to_gold'){
      if(atTarget){
        if(st.state==='walking_to_tree'){st.state='chopping';st.timer=hasLumberMill?50:100}
        else if(st.state==='walking_to_rock'){st.state='mining';st.timer=hasQuarry?70:140}
        else{st.state='mining_gold';st.timer=200}
      }
    }
    else if(st.state==='chopping'){
      st.timer-=(isLazy?0.5:1);
      const maxT=hasLumberMill?50:100;
      const chopProg=1-st.timer/maxT;
      // Update harvest animation
      if(st.target){
        const key=`${st.target.x},${st.target.y}`;
        harvestAnim.set(key,{progress:chopProg,shakeTimer:0,type:'tree'});
        // Impact every 15 frames
        if(frame%15===0){
          harvestAnim.get(key).shakeTimer=5;
          // Wood chips
          for(let i=0;i<4;i++)spawnParticle(st.target.x+TS/2+(Math.random()-0.5)*10,st.target.y+TS*0.6,'debris');
          impactTexts.push({x:st.target.x+TS/2,y:st.target.y+TS*0.3,text:'chop!',color:'#b09050',life:0,maxLife:18});
        }
      }
      if(st.timer<=0){
        G.wood+=5;getAgentSocial(a.id).morale=Math.min(100,getAgentSocial(a.id).morale+5);
        gameEvent(`${a.name} chopped a tree (+5 wood)`,'build_complete');
        if(st.target){
          const key2=`${st.target.x},${st.target.y}`;
          harvestables.set(key2,true);harvestAnim.delete(key2);
          // Leave stump
          stumps.push({x:st.target.x,y:st.target.y,type:'stump',timer:1800});
          // Tree fall particles
          for(let i=0;i<6;i++)spawnParticle(st.target.x+TS/2+(Math.random()-0.5)*16,st.target.y+TS*0.4,'debris');
        }
        st.state='idle';st.taskCooldown=15;
      }
    }
    else if(st.state==='mining'){
      st.timer-=(isLazy?0.5:1);
      const maxT2=hasQuarry?70:140;
      const mineProg=1-st.timer/maxT2;
      if(st.target){
        const key=`${st.target.x},${st.target.y}`;
        harvestAnim.set(key,{progress:mineProg,shakeTimer:0,type:'rock'});
        if(frame%20===0){
          harvestAnim.get(key).shakeTimer=4;
          spawnParticle(st.target.x+TS/2,st.target.y+TS/2,'gold');// bright spark
          spawnParticle(st.target.x+TS/2+(Math.random()-0.5)*8,st.target.y+TS/2,'debris');
          impactTexts.push({x:st.target.x+TS/2,y:st.target.y+TS*0.3,text:'clink!',color:'#aaa',life:0,maxLife:18});
        }
      }
      if(st.timer<=0){
        G.stone+=3;getAgentSocial(a.id).morale=Math.min(100,getAgentSocial(a.id).morale+5);
        gameEvent(`${a.name} mined stone (+3 stone)`,'build_complete');
        if(st.target){
          const key2=`${st.target.x},${st.target.y}`;
          harvestables.set(key2,true);harvestAnim.delete(key2);
          stumps.push({x:st.target.x,y:st.target.y,type:'rubble',timer:1200});
          for(let i=0;i<5;i++)spawnParticle(st.target.x+TS/2+(Math.random()-0.5)*14,st.target.y+TS/2,'debris');
        }
        st.state='idle';st.taskCooldown=15;
      }
    }
    else if(st.state==='mining_gold'){
      st.timer-=(isLazy?0.5:1);
      if(st.target&&frame%20===0){
        spawnParticle(st.target.x+TS/2,st.target.y+TS/2,'gold');
        impactTexts.push({x:st.target.x+TS/2,y:st.target.y+TS*0.3,text:'clink!',color:'#ffd700',life:0,maxLife:18});
      }
      if(st.timer<=0){
        G.gold+=1;
        gameEvent(`${a.name} found gold (+1 gold)`,'build_complete');
        if(st.target)st.target.alive=false;
        st.state='idle';st.taskCooldown=15;
      }
    }
    else if(st.state==='building'){
      if(!st.target||st.target.complete){st.state='idle';st.taskCooldown=15;continue}
      if(!atTarget){v.tx=st.target.x/WW;v.ty=st.target.y/WH;continue}
      st.target.progress=Math.min(1,st.target.progress+0.008);
      // Building impact effects
      if(frame%12===0){
        const bpx=st.target.x*TS+TS,bpy=st.target.y*TS+TS;
        spawnParticle(bpx+(Math.random()-0.5)*10,bpy-5,'debris');
        const txt=G.era<2?'tap!':'tink!';
        const col2=G.era<1?'#b09050':'#aaa';
        impactTexts.push({x:bpx,y:bpy-10,text:txt,color:col2,life:0,maxLife:15});
      }
      if(st.target.progress>=1){
        st.target.complete=true;st.target.claimedBy=null;
        st.target.owner=a.id;st.target.ownerName=a.name;
        st.target.ownedSince=frame;st.target.personalized=false;
        const soc=getAgentSocial(a.id);soc.builtCount++;soc.morale=Math.min(100,soc.morale+10);
        // Assign as home if shelter type and no home yet
        const shelters=['wood_hut','log_cabin','stone_house','brick_house','apartment'];
        if(!soc.home&&shelters.includes(st.target.type)){
          soc.home=st.target;st.target.isHome=true;
          gameEvent(`${a.name} completed ${st.target.name} — it's home!`,'build_complete');
        }else{
          gameEvent(`${a.name} completed ${st.target.name}!`,'build_complete');
        }
        st.state='idle';st.taskCooldown=30;
      }
    }
  }
}

  document.getElementById('era-fill').style.width=`${Math.round(eraProg*100)}%`;
  // Available builds (show all affordable in current era)
  const bp=document.getElementById('build-preview');

    }).join('');
  }else{bp.innerHTML='<span style="color:#aaffaa">All era buildings complete!</span>'}
  // Village list
  const vs=document.getElementById('village-section');

  if(villages.length>0){
    vs.style.display='';
    vl2.innerHTML=villages.map(v2=>{
      const pop=S.agents.filter(a2=>{const v3=agentVisual.get(a2.id);return v3&&Math.abs(v3.x*WW-v2.cx)+Math.abs(v3.y*WH-v2.cy)<15}).length;
      return`<div style="margin-bottom:3px"><b style="color:${FC[v2.faction]||'#ccc'}">${v2.name}</b> <span style="color:var(--dim)">${v2.buildings.length} bldgs, ${pop} pop</span></div>`;
    }).join('');
  }else{vs.style.display='none'}
  // Playtime
  const secs=Math.floor(frame/60);
  document.getElementById('h-playtime').textContent=`${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
  // Minimap
  updateMinimap();
}
const STATE_ICONS={idle:'💤',walking_to_tree:'🪓',walking_to_rock:'⛏',walking_to_gold:'🪙',chopping:'🪓',mining:'⛏',mining_gold:'🪙',building:'🔨'};
const STATE_LABELS={idle:'Idle',walking_to_tree:'Walking to tree',walking_to_rock:'Walking to rock',walking_to_gold:'Walking to gold',chopping:'Chopping tree',mining:'Mining stone',mining_gold:'Mining gold',building:'Building'};
function updateMinimap(){
  const mc=document.getElementById('minimap');
  const mx2=mc.getContext('2d');mx2.imageSmoothingEnabled=false;
  mx2.fillStyle='#0a0a14';mx2.fillRect(0,0,140,100);
  // Terrain (simplified)
  const sx2=140/WW,sy2=100/WH;
  for(let y=0;y<WH;y+=3)for(let x=0;x<WW;x+=3){
    const bi=tBiomes[y*WW+x],b=BL[bi],co=BC[b];
    mx2.fillStyle=co[0];mx2.fillRect(x*sx2,y*sy2,sx2*3+1,sy2*3+1);
  }
  // Buildings
  for(const b of G.clientBuildings){
    mx2.fillStyle=BFC[b.faction]?BFC[b.faction].flag:'#888';
    mx2.fillRect(b.x*sx2-1,b.y*sy2-1,3,3);
  }
  // Gold deposits
  mx2.fillStyle='#ffd700';
  for(const g of goldDeposits){if(g.alive)mx2.fillRect(g.x/TS*sx2,g.y/TS*sy2,2,2)}
  // Agents
  for(const a of S.agents){
    const v=agentVisual.get(a.id);
    if(!v)continue;
    mx2.fillStyle=TEAM_COL[a.faction]||'#888';
    mx2.fillRect(v.x*WW*sx2-1,v.y*WH*sy2-1,3,3);
  }
  // Viewport rect
  const vl=(-vpX/TS)*sx2,vt=(-vpY/TS)*sy2;
  const vw=(canvasEl.width/zoom/TS)*sx2,vh=(canvasEl.height/zoom/TS)*sy2;
  mx2.strokeStyle='#fff';mx2.lineWidth=1;mx2.strokeRect(vl,vt,vw,vh);
}

// === Render ===
let frame=0;
function render(){
try{
// Frame timing
const _now=performance.now(),_dt=_now-_lastFrameTime;_lastFrameTime=_now;
_frameTimes.push(_dt);if(_frameTimes.length>60)_frameTimes.shift();
_slowMode=_dt>32;// below 30fps
frame++;G.tick=frame;
// Heartbeat every 60 seconds
if(frame%(60*60)===0)console.log(`Game heartbeat: ${frame} frames, ${S.agents.length} agents, ${G.clientBuildings.length} buildings, ${particles.length} particles, ${footprints.length} footprints`);
// Periodic cleanup sweep every 60 seconds
if(frame%(60*60)===30){
  for(let i=particles.length-1;i>=0;i--)if(!particles[i]||particles[i].life>=particles[i].maxLife)particles.splice(i,1);
  for(let i=bubbles.length-1;i>=0;i--)if(!bubbles[i]||bubbles[i].life<=0)bubbles.splice(i,1);
  for(let i=stumps.length-1;i>=0;i--)if(!stumps[i]||stumps[i].timer<=0)stumps.splice(i,1);
  for(let i=impactTexts.length-1;i>=0;i--)if(!impactTexts[i]||impactTexts[i].life>=impactTexts[i].maxLife)impactTexts.splice(i,1);
  for(let i=footprints.length-1;i>=0;i--)if(!footprints[i]||footprints[i].life<=0)footprints.splice(i,1);
}
// Smooth pan animation
if(panTarget&&panFrames>0){
  vpX+=(panTarget.vpX-vpX)*0.12;vpY+=(panTarget.vpY-vpY)*0.12;
  zoom+=(panTarget.zoom-zoom)*0.12;
  panFrames--;if(panFrames<=0)panTarget=null;
}
if(panHighlight&&panHighlight.timer>0)panHighlight.timer--;
updateAgentMovement();
// Social/needs systems (throttled)
if(frame%60===0)tickNeeds();
if(frame%90===0)checkSocialInteractions();
socialCheckTimer--;if(socialCheckTimer<=0){socialCheckTimer=600;checkClanFormation();checkVillages()}
if(frame%300===0)tickPersonalization();
updateGameUI();
updateWorldEvents();
checkEraAnnounce();
smoothResources();
// Sync client buildings into S.buildings for rendering
S.buildings=G.clientBuildings.map(b=>({type:b.type,name:b.name,x:b.x,y:b.y,progress:b.progress,
  complete:b.complete,faction:b.faction,width:b.width,height:b.height,pw:b.pw,ph:b.ph,tall:b.tall,
  owner:b.owner,ownerName:b.ownerName,isHome:b.isHome,personalized:b.personalized,personalFaction:b.personalFaction}));
// Clamp camera to world bounds
const worldPxW=WW*TS,worldPxH=WH*TS;
const viewW=canvasEl.width/zoom,viewH=canvasEl.height/zoom;
vpX=Math.min(0,Math.max(-(worldPxW-viewW),vpX));
vpY=Math.min(0,Math.max(-(worldPxH-viewH),vpY));

const cw=canvasEl.width,ch=canvasEl.height;
// Fill with ocean color before anything (eliminates black void)
ctx.fillStyle='#061050';ctx.fillRect(0,0,cw,ch);
ctx.save();ctx.scale(zoom,zoom);ctx.translate(vpX,vpY);
const ts=TS;
const sx=Math.max(0,Math.floor(-vpX/ts-1)),sy=Math.max(0,Math.floor(-vpY/ts-1));
const ex=Math.min(WW,Math.ceil((-vpX+cw/zoom)/ts+1)),ey=Math.min(WH,Math.ceil((-vpY+ch/zoom)/ts+1));

// Terrain
if(tCanvas)ctx.drawImage(tCanvas,sx*ts,sy*ts,(ex-sx)*ts,(ey-sy)*ts,sx*ts,sy*ts,(ex-sx)*ts,(ey-sy)*ts);

// Village names and borders
for(const vl of villages){
  const vpx=vl.cx*ts,vpy=vl.cy*ts;
  // Dotted border circle
  ctx.strokeStyle=FC[vl.faction]||'#888';ctx.lineWidth=1;ctx.setLineDash([4,4]);
  ctx.globalAlpha=0.3;
  ctx.beginPath();ctx.arc(vpx+ts/2,vpy+ts/2,ts*5,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);ctx.globalAlpha=1;
  // Village name label
  ctx.font='bold 12px Courier New';
  const vtw=ctx.measureText(vl.name).width;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(vpx+ts/2-vtw/2-4,vpy-ts*3,vtw+8,16);
  ctx.fillStyle=FC[vl.faction]||'#ccc';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(vl.name,vpx+ts/2,vpy-ts*3+8);
}

// Home indicators (warm glow at night)
if(window._isNight){
  for(const b of G.clientBuildings){
    if(!b.isHome||!b.complete)continue;
    const hx=b.x*ts+ts/2,hy=b.y*ts+ts/2;
    ctx.fillStyle='rgba(255,200,80,0.08)';
    ctx.beginPath();ctx.arc(hx,hy,ts*1.5,0,Math.PI*2);ctx.fill();
  }
}

// Building personalization decorations
for(const b of G.clientBuildings){
  if(!b.personalized||!b.complete)continue;
  const bpx=b.x*ts,bpy=b.y*ts,bpw=(b.width||1)*ts;
  if(b.personalFaction==='human'){// flower boxes
    ctx.fillStyle='#dd4466';ctx.fillRect(bpx+4,bpy+bpw-4,3,3);
    ctx.fillStyle='#ddaa22';ctx.fillRect(bpx+10,bpy+bpw-4,3,3);
  }else if(b.personalFaction==='orc'){// skull + spikes
    ctx.fillStyle='#aaa';ctx.beginPath();ctx.arc(bpx+bpw/2,bpy+4,3,0,Math.PI*2);ctx.fill();
  }else if(b.personalFaction==='dwarf'){// ore display
    ctx.fillStyle='#ffcc44';ctx.fillRect(bpx+3,bpy+bpw-6,2,2);
    ctx.fillStyle='#888';ctx.fillRect(bpx+7,bpy+bpw-6,2,2);
  }else if(b.personalFaction==='elf'){// vines
    ctx.fillStyle='#3a8a28';
    for(let vy2=bpy+4;vy2<bpy+bpw-4;vy2+=6)ctx.fillRect(bpx,vy2,2,4);
  }
}

// Path trails between buildings
drawPaths(ctx,S.buildings,frame);

// Water animation — calm and gentle
// Gentle wave lines every 3-4 rows
for(let y=sy;y<ey;y++){
  if(y%3!==0)continue;// only every 3rd row
  for(let x=sx;x<ex;x++){
    const bi=tBiomes[y*WW+x];
    if(bi===0||bi===1||bi===10){
      const px2=x*ts,py2=y*ts;
      const waveY=py2+ts/2+Math.sin(x*0.3+frame*0.015)*2;
      ctx.strokeStyle='rgba(80,140,255,0.08)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(px2,waveY);ctx.lineTo(px2+ts,waveY);ctx.stroke();
    }
  }
}
// Gentle color variation + reflections + rare sparkles
let sparkleCount=0;
for(let y=sy;y<ey;y++){for(let x=sx;x<ex;x++){
  const bi=tBiomes[y*WW+x];
  if(bi===0||bi===1||bi===10){
    const px2=x*ts,py2=y*ts;
    // Subtle color breathing
    const blueShift=Math.sin(frame*0.008+x*0.1)*5;
    ctx.fillStyle=`rgba(${24+blueShift|0},${64+blueShift|0},${168+blueShift|0},0.04)`;
    ctx.fillRect(px2,py2,ts,ts);
    // Rare shimmer sparkles (0.2% chance, max 6 visible)
    const h=tileHash(x,y);
    const sparklePhase=((h*31+frame)%500);
    if(sparklePhase<40&&sparkleCount<6){
      const sa=Math.sin(sparklePhase/40*Math.PI)*0.35;
      if(sa>0.05){
        ctx.fillStyle=`rgba(170,221,255,${sa})`;
        const spx=px2+4+((h>>3)%14),spy=py2+4+((h>>6)%14);
        ctx.fillRect(spx,spy,2,2);
        sparkleCount++;
      }
    }
    // Water reflections: faint mirrored strip of adjacent land color
    const neighbors2=[[0,-1],[0,1],[-1,0],[1,0]];
    for(const[dx2,dy2] of neighbors2){
      const nx=x+dx2,ny=y+dy2;
      if(nx>=0&&nx<WW&&ny>=0&&ny<WH){
        const nbi=tBiomes[ny*WW+nx];
        if(nbi!==0&&nbi!==1&&nbi!==10){// neighbor is land
          const nb2=BL[nbi],nco=BC[nb2];
          ctx.fillStyle=nco[0];ctx.globalAlpha=0.1;
          // Draw faint strip on the side facing the land
          if(dy2<0)ctx.fillRect(px2,py2,ts,4);
          else if(dy2>0)ctx.fillRect(px2,py2+ts-4,ts,4);
          else if(dx2<0)ctx.fillRect(px2,py2,4,ts);
          else ctx.fillRect(px2+ts-4,py2,4,ts);
          ctx.globalAlpha=1;
        }
      }
    }
  }
}}

// === LAYERED DRAW ORDER ===

// Layer 2: Ground-level details (lily pads, flowers, tall grass, mushrooms)
const details=getDetails(sx,sy,ex,ey);
const groundTypes=new Set(['lilypad','flower','tallgrass','mushroom']);
for(const d of details){if(groundTypes.has(d.t))drawDetail(ctx,d,frame)}

// Territory overlays
for(const t of S.tiles){if(t.x<sx||t.x>=ex||t.y<sy||t.y>=ey)continue;if(t.owner){const ag=agentById(t.owner);if(ag){ctx.fillStyle=FC[ag.faction]||'#888';ctx.globalAlpha=0.15;ctx.fillRect(t.x*ts,t.y*ts,ts,ts);ctx.globalAlpha=1;
  ctx.fillStyle=FC[ag.faction]||'#888';ctx.globalAlpha=0.5;
  ctx.fillRect(t.x*ts,t.y*ts,ts,1);ctx.fillRect(t.x*ts,t.y*ts,1,ts);
  ctx.globalAlpha=1}}}

// Building progress now driven by agent AI state machine

// Layer 4-6: Merge buildings, standing details, and agents into one Y-sorted list
const renderItems=[];
// Standing details (trees, bushes, boulders, rocks, cacti, dead trees, pines)
for(const d of details){if(!groundTypes.has(d.t))renderItems.push({type:'detail',d,sortY:d.sY})}
// Buildings
const sortedBuildings=[...S.buildings];
for(const b of sortedBuildings){
  if(b.x+(b.width||1)<sx||b.x>=ex||b.y+(b.height||1)<sy||b.y>=ey)continue;
  renderItems.push({type:'building',b,sortY:(b.y+(b.height||1))*ts});
}
// Agents — compute animation state
const agentRenderData=[];
for(const a of S.agents){
  const v=agentVisual.get(a.id);
  const vx=v?v.x*WW:a.x,vy=v?v.y*WH:a.y;
  if(vx<sx-2||vx>=ex+2||vy<sy-2||vy>=ey+2)continue;
  if(!a._trail)a._trail=[];
  if(!a._prevX||Math.abs(a._prevX-vx)>0.01||Math.abs(a._prevY-vy)>0.01){
    a._trail.push({x:vx,y:vy});if(a._trail.length>3)a._trail.shift();a._idleFrames=0;
  }else{a._idleFrames=(a._idleFrames||0)+1}
  a._prevX=vx;a._prevY=vy;
  const isWalking=v&&(Math.abs(v.x-v.tx)>0.001||Math.abs(v.y-v.ty)>0.001);
  const faceLeft=v&&(v.tx<v.x);
  let isBuilding=false;
  for(const b of S.buildings){if(!b.complete&&b.progress!=null&&b.progress<1){if(Math.abs(vx-b.x)+Math.abs(vy-b.y)<4){isBuilding=true;break}}}
  if(isWalking&&frame%20===0)spawnParticle(vx*ts+ts/2,vy*ts+ts,'debris');
  if(isBuilding&&frame%10===4)spawnParticle(vx*ts+ts/2+((Math.random()-0.5)*8),vy*ts,'debris');
  if(a.personality==='lazy'&&frame%45===0)spawnParticle(vx*ts+ts/2+(Math.random()-0.5)*6,vy*ts-10,'leaf');
  agentRenderData.push({a,vx,vy,isWalking,faceLeft,isBuilding});
  renderItems.push({type:'agent',idx:agentRenderData.length-1,sortY:vy*ts+ts});
}

// Agent Z-fighting: offset agents within 5px of each other
for(let i=0;i<agentRenderData.length;i++){
  for(let j=i+1;j<agentRenderData.length;j++){
    const ai=agentRenderData[i],aj=agentRenderData[j];
    if(Math.abs(ai.vy*ts-aj.vy*ts)<5){aj.vy+=0.15}// offset ~3.6px
  }
}

// Sort everything by Y
renderItems.sort((a2,b2)=>a2.sortY-b2.sortY);

// Draw all items in order
for(const item of renderItems){
  if(item.type==='detail'){

  }else if(item.type==='building'){

    if(p>0.5){
      const nm=BNames[b.type]||b.type;
      ctx.font='8px Courier New';
      const ntw=ctx.measureText(nm).width;
      ctx.fillStyle='rgba(0,0,0,0.6)';
      ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(bx+bw/2-ntw/2-3,by+bh+2,ntw+6,11,3);
      else ctx.rect(bx+bw/2-ntw/2-3,by+bh+2,ntw+6,11);

      ctx.fillStyle='#ccc';ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillText(nm,bx+bw/2,by+bh+3);
    }
  }else if(item.type==='agent'){
    const ad=agentRenderData[item.idx];
    const tc=TEAM_COL[ad.a.faction]||'#888';
    // Movement trail
    for(let ti=0;ti<ad.a._trail.length-1;ti++){
      const tp=ad.a._trail[ti];
      ctx.fillStyle=tc;ctx.globalAlpha=0.06*(ti+1)/ad.a._trail.length;
      ctx.beginPath();ctx.arc(tp.x*ts+ts/2,tp.y*ts+ts-4,4-ti,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }
    // Footprints (stamp every 30 frames while walking)
    if(ad.isWalking&&frame%30===0){
      footprints.push({x:ad.vx*ts+ts/2,y:ad.vy*ts+ts,life:120});
    }
    const ax=ad.vx*ts+ts/2,ay=ad.vy*ts+ts-4;
    const sel=selAgent&&selAgent.id===ad.a.id;
    // Determine carrying/resting state
    const ast2=agentState.get(ad.a.id);
    const isResting=ast2&&ast2.taskCooldown>60&&getAgentSocial(ad.a.id).energy<40;
    const isChopping2=ast2&&ast2.state==='chopping';
    const isMining2=ast2&&(ast2.state==='mining'||ast2.state==='mining_gold');
    // Carrying: if walking to build after gathering
    let carrying=null;
    if(ad.isWalking&&ast2){
      if(ast2.state==='walking_to_tree')carrying=null;
      else if(G.wood>5)carrying='wood';
      else if(G.stone>3)carrying='stone';
    }
    drawAgentPixelArt(ctx,ax,ay,ad.a,sel,frame,{walking:ad.isWalking,building:ad.isBuilding,faceLeft:ad.faceLeft,idleFrames:ad.a._idleFrames||0,resting:isResting,carrying,chopping:isChopping2,mining:isMining2});
    // Highlight circle for pan-to-agent
    if(panHighlight&&panHighlight.id===ad.a.id&&panHighlight.timer>0){
      const hAlpha=0.3+0.3*Math.sin(frame*0.15);

    }
  }
}

// Stumps and rubble (left behind after harvesting)
for(let si=stumps.length-1;si>=0;si--){
  const s=stumps[si];s.timer--;
  if(s.timer<=0){stumps.splice(si,1);continue}
  const sa=Math.min(1,s.timer/60);// fade out last second
  ctx.globalAlpha=sa;
  if(s.type==='stump'){
    ctx.fillStyle='#5a3a18';ctx.fillRect(s.x+TS/2-3,s.y+TS-5,6,4);
    ctx.fillStyle='#4a2a10';ctx.beginPath();ctx.ellipse(s.x+TS/2,s.y+TS-5,4,2,0,0,Math.PI*2);ctx.fill();
  }else{// rubble
    ctx.fillStyle='#6a6872';
    ctx.fillRect(s.x+4,s.y+TS-5,5,3);ctx.fillRect(s.x+10,s.y+TS-4,4,2);ctx.fillRect(s.x+16,s.y+TS-3,3,2);
  }
  ctx.globalAlpha=1;
}

// Footprints
for(let fi=footprints.length-1;fi>=0;fi--){
  const fp=footprints[fi];fp.life--;
  if(fp.life<=0){footprints.splice(fi,1);continue}
  ctx.fillStyle=`rgba(90,80,60,${fp.life/120*0.15})`;
  ctx.fillRect(fp.x-1,fp.y,2,1);
}
if(footprints.length>60)footprints.splice(0,20);
if(impactTexts.length>10)impactTexts.splice(0,5);
if(stumps.length>15)stumps.splice(0,5);

// Impact text particles
for(let ti=impactTexts.length-1;ti>=0;ti--){
  const it=impactTexts[ti];it.life++;
  if(it.life>=it.maxLife){impactTexts.splice(ti,1);continue}
  const ta=1-it.life/it.maxLife;
  ctx.globalAlpha=ta;ctx.fillStyle=it.color;
  ctx.font='bold 7px Courier New';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText(it.text,it.x,it.y-it.life*0.8);
  ctx.globalAlpha=1;
}

// === Ambient Particles ===
updateParticles();
for(const p of particles){
  if(p.x<sx*ts||p.x>ex*ts||p.y<sy*ts||p.y>ey*ts)continue;
  ctx.globalAlpha=p.alpha;
  ctx.fillStyle=p.color;
  if(p.radius){
    ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillRect(p.x,p.y,p.size||2,p.size||2);
  }
  ctx.globalAlpha=1;
}

// Birds (WORLD-SPACE: positions are in tile coords, drawn inside camera transform)
// Update bird positions HERE (inside world transform, before drawing)
for(const b2 of ambientBirds){
  b2.wx+=b2.vx;
  b2.wy=15+Math.sin(frame*0.008+b2.phase)*8+Math.sin(frame*0.003+b2.phase*2)*5;
  if(b2.wx>WW+5){b2.wx=-5;b2.wy=10+Math.random()*20}
}
for(const bird of ambientBirds){
  // Convert world tile coords to world pixel coords (same as buildings/agents)
  const bpx=bird.wx*ts,bpy=bird.wy*ts;
  // Wing flap animation
  const flap=Math.sin(frame*0.15+bird.phase*3)*2;
  ctx.strokeStyle='#333';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(bpx-5,bpy+flap);ctx.lineTo(bpx,bpy);ctx.lineTo(bpx+5,bpy+flap);ctx.stroke();
  ctx.lineWidth=1;
}

// Speech bubbles (on top of everything)
for(let i=bubbles.length-1;i>=0;i--){
  const bub=bubbles[i];
  bub.life--;
  if(bub.life<=0){bubbles.splice(i,1);continue}
  const ag=bub.agent;
  const v=agentVisual.get(ag.id);
  const vx2=v?v.x*WW:ag.x,vy2=v?v.y*WH:ag.y;
  const bounce=Math.sin(frame*0.1)*1;
  const bax=vx2*ts+ts/2,bay=vy2*ts-60+bounce;
  const alpha=Math.min(1,bub.life/30,(bub.maxLife-bub.life+1)/30);
  ctx.globalAlpha=alpha;
  const txt=bub.text;
  ctx.font='10px Courier New';
  const btw=ctx.measureText(txt).width;
  const bpw=Math.max(60,btw+12),bph=24;
  const bbx=bax-bpw/2,bby=bay-bph/2;
  // Drop shadow
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(bbx+2,bby+2,bpw,bph,6);
  else ctx.rect(bbx+2,bby+2,bpw,bph);
  ctx.fill();
  // White background
  ctx.fillStyle='#fffff0';ctx.strokeStyle='#888866';ctx.lineWidth=1.5;
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(bbx,bby,bpw,bph,6);
  else ctx.rect(bbx,bby,bpw,bph);
  ctx.fill();ctx.stroke();
  // Smooth pointer triangle (8px wide)
  ctx.fillStyle='#fffff0';
  ctx.beginPath();ctx.moveTo(bax-4,bby+bph);ctx.lineTo(bax+4,bby+bph);ctx.lineTo(bax,bby+bph+8);ctx.fill();
  ctx.strokeStyle='#888866';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(bax-4,bby+bph);ctx.lineTo(bax,bby+bph+8);ctx.lineTo(bax+4,bby+bph);ctx.stroke();
  // Text
  ctx.fillStyle='#222';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(txt,bax,bay);
  ctx.globalAlpha=1;
  ctx.lineWidth=1;
}

ctx.restore();

// 1. VIGNETTE (screen-space)
const cw2=canvasEl.width,ch2=canvasEl.height;
const vigGrad=ctx.createRadialGradient(cw2/2,ch2/2,Math.min(cw2,ch2)*0.35,cw2/2,ch2/2,Math.max(cw2,ch2)*0.7);
vigGrad.addColorStop(0,'rgba(0,0,0,0)');vigGrad.addColorStop(1,'rgba(0,0,0,0.3)');
ctx.fillStyle=vigGrad;ctx.fillRect(0,0,cw2,ch2);

// 2. SMOOTH DAY/NIGHT CYCLE (18000 frames = 5 min at 60fps)
const cycleLen=18000;
const cyclePhase=(frame%cycleLen)/cycleLen;
// Color stops: {pos, r, g, b, a}
const dnStops=[
  {p:0.00,r:255,g:160,b:120,a:0.06},
  {p:0.15,r:255,g:250,b:230,a:0.02},
  {p:0.30,r:0,g:0,b:0,a:0.0},
  {p:0.50,r:255,g:245,b:200,a:0.03},
  {p:0.65,r:255,g:200,b:100,a:0.06},
  {p:0.75,r:255,g:120,b:60,a:0.10},
  {p:0.82,r:80,g:50,b:120,a:0.12},
  {p:0.90,r:10,g:10,b:40,a:0.22},
  {p:0.95,r:5,g:5,b:30,a:0.28},
  {p:1.00,r:40,g:20,b:60,a:0.18},
];
// Cosine interpolation between stops
let s0=dnStops[dnStops.length-1],s1=dnStops[0];
for(let i=0;i<dnStops.length-1;i++){if(cyclePhase>=dnStops[i].p&&cyclePhase<dnStops[i+1].p){s0=dnStops[i];s1=dnStops[i+1];break}}
const stRange=s1.p-s0.p||0.01;
const stT=(cyclePhase-s0.p)/stRange;
const cosT=(1-Math.cos(stT*Math.PI))/2;// smooth cosine lerp
const cr=Math.round(s0.r+(s1.r-s0.r)*cosT);
const cg=Math.round(s0.g+(s1.g-s0.g)*cosT);
const cb=Math.round(s0.b+(s1.b-s0.b)*cosT);
const ca=(s0.a+(s1.a-s0.a)*cosT).toFixed(3);
if(ca>0.005){ctx.fillStyle=`rgba(${cr},${cg},${cb},${ca})`;ctx.fillRect(0,0,cw2,ch2)}
// Stars (visible during night 0.85-1.0 and 0.0-0.05)
const nightness=cyclePhase>0.85?Math.min(1,(cyclePhase-0.85)/0.05):cyclePhase<0.05?(1-cyclePhase/0.05)*0.5:0;
if(nightness>0.01){
  for(let si=0;si<_stars.length;si++){
    const st2=_stars[si];
    const twinkle=0.3+0.7*Math.abs(Math.sin(frame*st2.rate+st2.off));
    ctx.fillStyle=`rgba(255,255,255,${(nightness*twinkle*0.8).toFixed(2)})`;
    ctx.fillRect(st2.x%cw2,st2.y%ch2,st2.sz,st2.sz);
  }
}
// Update time-of-day UI
const phases=[{p:0,n:'Dawn',i:'🌅'},{p:0.15,n:'Morning',i:'☀️'},{p:0.30,n:'Midday',i:'☀️'},{p:0.50,n:'Afternoon',i:'🌤'},{p:0.65,n:'Sunset',i:'🌅'},{p:0.82,n:'Dusk',i:'🌆'},{p:0.88,n:'Night',i:'🌙'},{p:0.95,n:'Late Night',i:'🌙'}];
let phaseName='Morning',phaseIcon='☀️';
for(let i=phases.length-1;i>=0;i--){if(cyclePhase>=phases[i].p){phaseName=phases[i].n;phaseIcon=phases[i].i;break}}
if(frame%30===0){document.getElementById('h-time-name').textContent=phaseName;document.getElementById('h-time-icon').textContent=phaseIcon}
// Shadow direction offset (exported for use by other systems)
window._shadowOffX=Math.sin(cyclePhase*Math.PI*2)*6;
window._isNight=nightness>0.3;

// WEATHER — Rain
if(weatherState.type==='rain'){
  ctx.strokeStyle='rgba(150,180,220,0.15)';ctx.lineWidth=1;
  for(let i=0;i<40;i++){
    const rx=(tileHash(i,frame)%cw2),ry=((frame*3+i*47)%ch2);
    ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-3,ry+8);ctx.stroke();
  }
}

// AMBIENT CREATURES (skip in slow mode)
if(!_slowMode){
updateAmbientCreatures(cw2,ch2);
for(const bf of ambientButterflies){
  ctx.fillStyle=bf.col;
  ctx.fillRect(bf.x-1,bf.y-1,3,3);
  ctx.fillRect(bf.x-3,bf.y,2,2);ctx.fillRect(bf.x+2,bf.y,2,2);
}
}// end slow mode skip

// 6. PULSE LIVE INDICATOR
const liveEl=document.getElementById('h-status');
const liveDot=document.getElementById('live-dot');
if(S.connected&&liveEl){

// === Ambient Particle System ===
const particles=[];
function spawnParticle(x,y,type){
  if(particles.length>=30){particles.shift()}// hard cap 30, remove oldest
  const p={x,y,type,life:0,maxLife:60,alpha:1,size:2,color:'#fff',vx:0,vy:0,radius:0};
  if(type==='gold'){
    p.color='#ffd700';p.size=2;p.vy=-0.3;p.maxLife=60;
    p.vx=(Math.random()-0.5)*0.3;
  }else if(type==='smoke'){
    p.color='rgba(150,150,160,1)';p.radius=2;p.vy=-0.2;p.vx=0.1;p.maxLife=90;
  }else if(type==='leaf'){
    const greens=['#3a8a28','#4aaa38','#2a7a18','#5abc3a'];
    p.color=greens[Math.floor(Math.random()*greens.length)];
    p.size=2;p.vy=-0.1;p.vx=0.15;p.maxLife=120;
  }else if(type==='debris'){
    p.color='#8a6a30';p.size=1;p.vy=-1.5;p.vx=(Math.random()-0.5)*0.8;p.maxLife=40;
  }
  particles.push(p);
}

function updateParticles(){
  // Spawn ambient particles
  // Gold sparkles near gold mine buildings
  if(frame%30===0){
    for(const b of S.buildings){
      if(b.type==='mine_shaft'&&b.complete){
        spawnParticle(b.x*TS+Math.random()*TS*2,b.y*TS+Math.random()*TS,'gold');
      }
    }
  }
  // Smoke from completed buildings with chimneys
  if(frame%20===0){
    for(const b of S.buildings){
      if(b.complete&&tileHash(b.x||0,b.y||0)%3===0&&!b.tall){
        const bw2=(b.width||1)*TS;
        spawnParticle(b.x*TS+bw2*0.7+3,b.y*TS-4,'smoke');
      }
    }
  }
  // Leaf particles near forests and elf buildings
  if(frame%40===0){
    for(const b of S.buildings){
      if(b.complete&&(b.type==='tree_palace'||b.type==='grove'||b.type==='sentinel_tree')){
        spawnParticle(b.x*TS+Math.random()*TS*2,b.y*TS+Math.random()*TS,'leaf');
      }
    }
    // Also near forest edges in visible area
    if(Math.random()<0.3){
      const rx=Math.floor(Math.random()*WW),ry=Math.floor(Math.random()*WH);
      if(tBiomes&&(tBiomes[ry*WW+rx]===4||tBiomes[ry*WW+rx]===5)){// forest or dense_forest
        spawnParticle(rx*TS+Math.random()*TS,ry*TS+Math.random()*TS,'leaf');
      }
    }
  }

  // Update all particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life++;
    if(p.life>=p.maxLife){particles.splice(i,1);continue}
    const t=p.life/p.maxLife;
    p.x+=p.vx;p.y+=p.vy;
    // Type-specific behavior
    if(p.type==='gold'){
      p.alpha=1-t;
    }else if(p.type==='smoke'){
      p.radius=2+t*3;
      p.alpha=0.4*(1-t);
    }else if(p.type==='leaf'){
      p.x+=Math.sin(p.life*0.08)*0.3;// sine drift
      p.alpha=0.6*(1-t);
    }else if(p.type==='debris'){
      p.vy+=0.08;// gravity
      p.alpha=1-t;
    }
    // cap enforced in spawnParticle
  }
}

// === Custom Pixel-Art Cursor ===
function drawCursorArrow(cx,ox,oy){
  // Arrow shape: 28px tall, 18px wide, top-left pointing
  // Define arrow polygon points
  const pts=[[0,0],[0,28],[6,22],[10,30],[14,28],[10,20],[18,20]];
  // Dark 2px outline
  cx.fillStyle='#1a1008';
  cx.save();cx.translate(ox,oy);
  cx.beginPath();cx.moveTo(pts[0][0]-1,pts[0][1]-1);
  for(let i=1;i<pts.length;i++)cx.lineTo(pts[i][0]+(pts[i][0]>5?2:-1),pts[i][1]+(pts[i][1]>15?2:-1));
  cx.closePath();cx.fill();
  // Main fill with 3-band gradient effect
  cx.beginPath();cx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)cx.lineTo(pts[i][0],pts[i][1]);
  cx.closePath();
  // Fill body medium gold
  cx.fillStyle='#b89840';cx.fill();
  // Left highlight strip (3px wide along left edge)
  cx.fillStyle='#e8d070';
  cx.beginPath();cx.moveTo(0,0);cx.lineTo(0,28);cx.lineTo(3,24);cx.lineTo(3,0);cx.closePath();cx.fill();
  // Right shadow strip
  cx.fillStyle='#8a6a20';
  cx.beginPath();cx.moveTo(14,20);cx.lineTo(18,20);cx.lineTo(8,0);cx.lineTo(5,0);cx.closePath();cx.fill();
  // Crossguard near base (dagger feel)
  cx.fillStyle='#3a2a10';
  cx.fillRect(-2,18,10,2);
  cx.fillStyle='#6a5a30';
  cx.fillRect(-1,18,8,1);
  // Bright tip pixel
  cx.fillStyle='#fff8d0';
  cx.fillRect(0,0,2,2);
  cx.restore();
}

function createCursor(mode){
  const cc=document.createElement('canvas');cc.width=48;cc.height=48;
  const cx=cc.getContext('2d');cx.imageSmoothingEnabled=false;
  drawCursorArrow(cx,2,2);

  if(mode==='hover'){
    // Glowing interaction ring
    const rcx=12,rcy=38;
    cx.fillStyle='rgba(200,170,60,0.3)';
    cx.beginPath();cx.arc(rcx,rcy,7,0,Math.PI*2);cx.fill();
    cx.strokeStyle='#c8a84a';cx.lineWidth=2;
    cx.beginPath();cx.arc(rcx,rcy,7,0,Math.PI*2);cx.stroke();
    cx.lineWidth=1;
    // Tiny person silhouette inside
    cx.fillStyle='#e8d070';
    cx.fillRect(rcx-1,rcy-4,3,5);// body
    cx.fillRect(rcx-1,rcy-6,2,2);// head
  }
  if(mode==='grab'){
    // Draw open hand shape instead of ring
    const hx=10,hy=36;
    cx.fillStyle='#b89840';
    // Palm
    cx.fillRect(hx-4,hy,10,6);
    // Fingers
    cx.fillRect(hx-4,hy-4,3,5);cx.fillRect(hx-1,hy-5,2,6);
    cx.fillRect(hx+2,hy-5,2,6);cx.fillRect(hx+5,hy-3,2,4);
    // Thumb
    cx.fillRect(hx-6,hy+1,3,4);
    cx.strokeStyle='#1a1008';cx.lineWidth=1;
    cx.strokeRect(hx-6,hy-5,14,12);
  }
  return cc.toDataURL();
}

let cursorNormal='',cursorInteract='',cursorGrab='';
function initCursors(){
  cursorNormal=createCursor('normal');
  cursorInteract=createCursor('hover');
  cursorGrab=createCursor('grab');
  wrap.style.cursor=`url(${cursorNormal}) 2 2, pointer`;
}

function setCursor(type){
  const url=type==='hover'?cursorInteract:type==='grab'?cursorGrab:cursorNormal;
  wrap.style.cursor=`url(${url}) 2 2, pointer`;
}

// === Ambient Creatures ===
const ambientBirds=[];
const ambientButterflies=[];
const ambientLeaves=[];
let fishJumpTimer=400+Math.floor(Math.random()*200);

function initCreatures(){
  // Birds in WORLD space (tile coordinates)
  for(let i=0;i<4;i++){
    const wx=Math.random()*WW,wy=10+Math.random()*20;// near top of world, over forests/water
    ambientBirds.push({wx,wy,vx:0.02+Math.random()*0.03,phase:Math.random()*10});
  }
  const bfCols=['#ddaa22','#4488cc','#ee8833','#dddddd'];
  for(let i=0;i<3;i++)ambientButterflies.push({x:200+Math.random()*600,y:200+Math.random()*300,col:bfCols[i%4],phase:Math.random()*10});
}

function updateAmbientCreatures(cw3,ch3){
  // Birds are updated+drawn inside world transform (see render loop)
  // Butterflies (screen-space, chaotic flutter near center)
  for(const bf of ambientButterflies){
    bf.x+=Math.sin(frame*0.03+bf.phase)*1.2+0.2;
    bf.y+=Math.cos(frame*0.04+bf.phase*1.3)*0.8;
    if(bf.x>cw3-100)bf.x=100;if(bf.x<100)bf.x=cw3-100;
    if(bf.y>ch3-100)bf.y=200;if(bf.y<100)bf.y=ch3-200;
  }
  // Fish jumps
  fishJumpTimer--;
  if(fishJumpTimer<=0){
    fishJumpTimer=400+Math.floor(Math.random()*200);
    // Spawn a fish jump particle near water
    const fx=Math.random()*WW*TS,fy=Math.random()*WH*TS;
    const tx=Math.floor(fx/TS),ty=Math.floor(fy/TS);
    if(tx>=0&&tx<WW&&ty>=0&&ty<WH){
      const bi=tBiomes[ty*WW+tx];
      if(bi===0||bi===1||bi===10){
        particles.push({x:fx,y:fy,type:'fish',life:0,maxLife:40,alpha:1,size:4,color:'#8a9ab0',vx:0,vy:-0.8,radius:0});
      }
    }
  }
  // Falling leaves (spawn from trees)
  if(frame%80===0&&ambientLeaves.length<6){
    const rx=Math.floor(Math.random()*WW),ry=Math.floor(Math.random()*WH);
    if(tBiomes&&(tBiomes[ry*WW+rx]===4||tBiomes[ry*WW+rx]===5)){
      const leafCol=Math.random()>0.5?'#8a6a20':'#cc8830';
      particles.push({x:rx*TS+Math.random()*TS,y:ry*TS,type:'fallingLeaf',life:0,maxLife:120,alpha:0.8,size:2,color:leafCol,vx:0,vy:0.3,radius:0});
    }
  }
  // Update fish particles specially
  for(const p of particles){
    if(p.type==='fish'){
      const t2=p.life/p.maxLife;
      p.vy=t2<0.5?-0.8:0.5;// arc up then down
      p.alpha=t2>0.9?1-(t2-0.9)*10:1;
      if(t2>0.5&&t2<0.55){// splash ring
        spawnParticle(p.x,p.y+5,'debris');
      }
    }
    if(p.type==='fallingLeaf'){
      p.x+=Math.sin(p.life*0.08)*0.5;// zigzag
      p.alpha=0.8*(1-p.life/p.maxLife);
    }
  }
}

// === Weather & World Events ===
const weatherState={type:'clear',timer:0};
const WEATHER_INTERVAL=60*60*1.5;// ~90 sec at 60fps
let weatherCooldown=WEATHER_INTERVAL;
const DISCOVERY_MSGS=['Found ancient ruins nearby!','Discovered a hidden gold vein!','Uncovered a crystal cave!','Found fertile soil patch!','Spotted rare minerals!'];

function updateWorldEvents(){
  weatherCooldown--;
  if(weatherCooldown<=0){
    weatherCooldown=WEATHER_INTERVAL*(0.7+Math.random()*0.6);
    const roll=Math.random();
    if(roll<0.3){
      // Rain
      weatherState.type='rain';weatherState.timer=60*15;
      const a=S.agents[Math.floor(Math.random()*S.agents.length)];
      if(a)gameEvent(`${a.name}: It's raining...`,'agent_message');
    }else if(roll<0.5){
      // Wind gust
      weatherState.type='wind';weatherState.timer=60*5;
    }else if(roll<0.7){
      // Discovery event
      const a=S.agents[Math.floor(Math.random()*S.agents.length)];
      if(a){
        const msg=DISCOVERY_MSGS[Math.floor(Math.random()*DISCOVERY_MSGS.length)];
        gameEvent(`${a.name}: ${msg}`,'build_complete');
        // Sparkle particles
        const v=agentVisual.get(a.id);
        if(v){for(let i=0;i<5;i++)spawnParticle(v.x*WW*TS+Math.random()*20-10,v.y*WH*TS-10+Math.random()*20,'gold')}
      }
    }
  }
  // Tick weather timer
  if(weatherState.timer>0){
    weatherState.timer--;
    if(weatherState.timer<=0)weatherState.type='clear';
  }
}

// === Era Announcement ===
let lastEra=-1;
function checkEraAnnounce(){
  if(G.era!==lastEra&&lastEra>=0){
    const el=document.getElementById('era-announce');
    el.textContent=`\u2B50 ${G.eraNames[G.era].toUpperCase()} UNLOCKED \u2B50`;
    el.style.opacity='1';
    document.getElementById('app').style.borderColor='#f0c040';
    showNotification(`⭐ ${G.eraNames[G.era]} Unlocked! ⭐`);
    setTimeout(()=>{el.style.opacity='0';document.getElementById('app').style.borderColor=''},3000);
  }
  lastEra=G.era;
}

// === Smooth Resource Counter ===
const resDisplay={wood:0,stone:0,gold:0,food:0};
function smoothResources(){
  let changed=false;
  for(const k of ['wood','stone','gold','food']){
    if(resDisplay[k]!==G[k]){
      const diff=G[k]-resDisplay[k];
      resDisplay[k]+=diff>0?Math.max(1,Math.ceil(diff*0.15)):Math.min(-1,Math.floor(diff*0.15));
      if(Math.abs(resDisplay[k]-G[k])<=1)resDisplay[k]=G[k];
      changed=true;
    }
  }
  if(changed){
    document.getElementById('r-wood').textContent=resDisplay.wood;
    document.getElementById('r-stone').textContent=resDisplay.stone;
    document.getElementById('r-gold').textContent=resDisplay.gold;
    document.getElementById('r-food').textContent=resDisplay.food;
  }
}
